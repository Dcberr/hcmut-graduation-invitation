services:
  invitation:
    build:
      context: .
      dockerfile: Dockerfile
    image: hcmut-invitation:local
    environment:
      INVITATION_ADMIN_TOKEN: ${INVITATION_ADMIN_TOKEN:-}
      GUEST_DATA_DIR: /app/data
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - guest-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  guest-data:

# Standalone deployment file: do not merge with compose.yaml (which has build).
services:
  invitation:
    image: ${INVITATION_IMAGE:?Set INVITATION_IMAGE to the image from GitHub Actions}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      INVITATION_ADMIN_TOKEN: ${INVITATION_ADMIN_TOKEN:-}
      GUEST_DATA_DIR: /app/data
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 320m
    pids_limit: 128
    volumes:
      - guest-data:/app/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  guest-data:
